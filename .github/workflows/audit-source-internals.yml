name: Audit PanVK source internals

on:
  workflow_dispatch:
  push:
    branches:
      - audit/fix-panvk-g720-mc7
      - audit/faux123-v1.1.8-g720-mc7

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source and inspect runtime paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source audit-output
          unzip -q mali-panvk-main.zip -d source
          ROOT="source/mali-panvk-main"
          test -d "$ROOT/src"
          echo "===== CHECK DA CORREÇÃO CANDIDATA ====="
          patch --dry-run -d "$ROOT" -p1 < patches/android/001-defer-kbase-acquire-fence.patch
          python3 - "$ROOT" audit-output/source-internals.txt <<'PY'
          import os, re, sys
          root, out = sys.argv[1:]
          terms = [
              r'pipeline.?cache', r'cache.?pipeline', r'vkCreatePipelineCache',
              r'vkGetPipelineCacheData', r'pipeline_cache_uuid', r'driverUUID',
              r'deviceUUID', r'CreateGraphicsPipelines', r'CreateComputePipelines',
              r'shader.?compile', r'compile.?shader', r'panvk_wsi',
              r'vkAcquireNextImageKHR', r'vkQueuePresentKHR', r'queue_present',
              r'ahardwarebuffer', r'AHardwareBuffer', r'dma.?buf',
              r'global.?mem', r'placed.?map', r'host.?import',
              r'panvk_pipeline', r'panvk_shader'
          ]
          rx = re.compile('|'.join('(?:%s)' % t for t in terms), re.I)
          exts = ('.c','.h','.cc','.cpp','.hpp','.inc','.xml','.py','.meson')
          files = []
          for base, dirs, names in os.walk(root):
              dirs[:] = [d for d in dirs if d not in ('build','build-android','.git')]
              for name in names:
                  p = os.path.join(base, name)
                  if name.endswith(exts):
                      files.append(p)
          hits = []
          for p in files:
              try:
                  with open(p, encoding='utf-8', errors='replace') as f:
                      lines = f.readlines()
              except OSError:
                  continue
              indexes = [i for i, line in enumerate(lines) if rx.search(line)]
              if indexes:
                  hits.append((p, lines, indexes))
          with open(out, 'w', encoding='utf-8') as f:
              f.write('PANVK SOURCE INTERNAL AUDIT\\n')
              f.write('Files scanned: %d\\nMatched files: %d\\n\\n' % (len(files), len(hits)))
              f.write('===== RELEVANT SOURCE FILES =====\\n')
              for p, _, _ in hits:
                  f.write(os.path.relpath(p, root) + '\\n')
              f.write('\\n===== MATCH CONTEXTS (up to 12 per file) =====\\n')
              for p, lines, indexes in hits:
                  f.write('\\n--- %s ---\\n' % os.path.relpath(p, root))
                  chosen = []
                  for i in indexes[:12]:
                      lo, hi = max(0, i-5), min(len(lines), i+7)
                      if chosen and lo <= chosen[-1][1]:
                          chosen[-1] = (chosen[-1][0], max(chosen[-1][1], hi))
                      else:
                          chosen.append((lo, hi))
                  for lo, hi in chosen:
                      f.write(' [lines %d-%d]\\n' % (lo+1, hi))
                      for j in range(lo, hi):
                          f.write('%6d  %s' % (j+1, lines[j]))
          print('Scanned %d files; matched %d files.' % (len(files), len(hits)))
          PY
          echo "===== AUDIT SUMMARY ====="
          sed -n '1,260p' audit-output/source-internals.txt

      - name: Package exact runtime source files
        shell: bash
        run: |
          set -euo pipefail
          ROOT="source/mali-panvk-main"
          OUT="audit-output/source-files"
          mkdir -p "$OUT"
          files=(
            src/panfrost/vulkan/panvk_vX_shader.c
            src/panfrost/vulkan/panvk_vX_device.c
            src/panfrost/vulkan/panvk_vX_physical_device.c
            src/panfrost/vulkan/panvk_vX_precomp_cache.c
            src/panfrost/vulkan/panvk_precomp_cache.h
            src/panfrost/vulkan/panvk_wsi.c
            src/panfrost/vulkan/panvk_wsi.h
            src/panfrost/vulkan/panvk_android.c
            src/panfrost/vulkan/panvk_device_memory.c
            src/panfrost/lib/kmod/kbase_kmod.c
            src/vulkan/runtime/vk_pipeline_cache.c
            src/vulkan/runtime/vk_pipeline_cache.h
            src/vulkan/wsi/wsi_common_android.c
            src/vulkan/wsi/wsi_common.c
            src/vulkan/runtime/vk_sync.c
            src/vulkan/runtime/vk_sync.h
            src/vulkan/runtime/vk_drm_syncobj.c
            src/util/u_sync_provider.c
            src/util/u_sync_provider.h
            src/vulkan/runtime/vk_android.c
            src/vulkan/runtime/vk_common.c
            src/vulkan/runtime/vk_shader.c
            src/panfrost/vulkan/panvk_queue.c
            src/panfrost/vulkan/panvk_queue.h
            src/panfrost/lib/kmod/pan_kmod.h
            src/vulkan/runtime/vk_pipeline.c
            src/panfrost/vulkan/csf/panvk_vX_cmd_draw.c
            src/panfrost/vulkan/csf/panvk_vX_cmd_precomp.c
          )
          for file in "${files[@]}"; do
            if [ -f "$ROOT/$file" ]; then
              mkdir -p "$OUT/$(dirname "$file")"
              cp "$ROOT/$file" "$OUT/$file"
            fi
          done
          echo "===== SELECTED FILES ====="
          find "$OUT" -type f -printf '%P (%s bytes)\\n'
          echo "===== KEY IMPLEMENTATION SYMBOLS ====="
          grep -R -n -E 'vk_pipeline_cache|pipeline_cache|compile_nir|compile_shader|AcquireNextImage|QueuePresent|sync_file|AHardwareBuffer|host.?import|memcpy|WaitIdle' "$OUT" || true

      - name: Upload source audit report
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-Source-Internals-Audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

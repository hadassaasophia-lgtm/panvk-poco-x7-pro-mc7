
name: Build PanVK POCO X7 Pro MC7

on:
  workflow_dispatch:
  push:
    branches:
      - audit/fix-panvk-g720-mc7

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar ferramentas básicas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip curl wget python3 python3-pip \
            pkg-config glslang-tools ninja-build \
            python3-mako python3-packaging python3-yaml \
            cmake git build-essential binutils file

      - name: Validar perfil e integridade do código-fonte
        run: |
          python3 scripts/validate_project.py \
            --archive mali-panvk-main.zip \
            --meta meta.json \
            --profile profiles/poco-x7-pro-mc7.json

      - name: Extrair código-fonte
        run: |
          mkdir -p source
          test -f mali-panvk-main.zip
          unzip -q mali-panvk-main.zip -d source
          test -f source/mali-panvk-main/build.sh
          echo "Código-fonte extraído com sucesso."

      - name: Diagnosticar WSI Android e testar compatibilidade do patch
        run: |
          set -e
          SOURCE="source/mali-panvk-main"
          echo "===== IMPLEMENTAÇÃO ANDROID WSI NO CÓDIGO-FONTE ====="
          for term in \
            "VK_USE_PLATFORM_ANDROID_KHR" \
            "VK_KHR_android_surface" \
            "panvk_CreateAndroidSurfaceKHR" \
            "VK_ICD_WSI_PLATFORM_ANDROID" \
            "ANativeWindow_lock" \
            "ANativeWindow_unlockAndPost"
          do
            echo "----- $term -----"
            grep -R -n -F "$term" "$SOURCE/src/panfrost" "$SOURCE/src/vulkan" \
              --include='*.c' --include='*.h' || true
          done

          echo "===== WSI PANVK ATUAL ====="
          if [ -f "$SOURCE/src/panfrost/vulkan/panvk_wsi.c" ]; then
            sed -n '1,240p' "$SOURCE/src/panfrost/vulkan/panvk_wsi.c"
          fi

          echo "===== TESTE DE APLICABILIDADE DA REFERÊNCIA ANDROID WSI ====="
          REF="https://raw.githubusercontent.com/zenithblue-oss/panvk-kbase-android/cf70e02b918e1864cbcd746a7fefa57b96c673ce/patches"
          mkdir -p "$RUNNER_TEMP/wsi-reference"
          curl -fL --retry 3 "$REF/kbase-common/006-device-queue-wsi-kbase.patch" -o "$RUNNER_TEMP/wsi-reference/006.patch"
          curl -fL --retry 3 "$REF/android/015-android-stub-static-hardware.patch" -o "$RUNNER_TEMP/wsi-reference/015.patch"
          curl -fL --retry 3 "$REF/wsi/016-android-surface-swapchain.patch" -o "$RUNNER_TEMP/wsi-reference/016.patch"
          for patch in 006 015 016; do
            echo "----- PATCH $patch: git apply --check -----"
            if git -C "$SOURCE" apply --check "$RUNNER_TEMP/wsi-reference/$patch.patch"; then
              echo "PATCH $patch APLICÁVEL SEM ALTERAR A ÁRVORE"
            else
              echo "PATCH $patch NÃO APLICÁVEL DIRETAMENTE; não será aplicado automaticamente"
            fi
          done
          echo "DIAGNÓSTICO WSI CONCLUÍDO; nenhuma alteração experimental foi aplicada."
          
      - name: Instalar LLVM 21 e tradutor SPIR-V
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

          sudo apt-get update
          sudo apt-get install -y \
            llvm-21-dev \
            libclang-21-dev \
            clang-21 \
            libclc-21-dev

          git clone --depth 1 --branch v21.1.13 \
            https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git \
            "$RUNNER_TEMP/spirv-llvm-translator"

          cmake -S "$RUNNER_TEMP/spirv-llvm-translator" \
            -B "$RUNNER_TEMP/spirv-llvm-translator/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DLLVM_SPIRV_INCLUDE_TESTS=OFF

          cmake --build "$RUNNER_TEMP/spirv-llvm-translator/build" \
            --parallel 2

          sudo cmake --build "$RUNNER_TEMP/spirv-llvm-translator/build" \
            --target install

          sudo ldconfig

      - name: Instalar Meson
        run: |
          python3 -m pip install --break-system-packages \
            "meson>=1.4.0"

      - name: Baixar Android NDK r29
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 \
            -o android-ndk-r29-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip

          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r29" >> "$GITHUB_ENV"

      - name: Verificar código-fonte
        run: |
          test -f source/mali-panvk-main/build.sh
          test -f source/mali-panvk-main/meson.build
          echo "Código-fonte confirmado."

      - name: Verificar ferramentas
        run: |
          meson --version
          ninja --version
          clang-21 --version
          glslangValidator --version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Compilar PanVK ARM64
        run: |
          cd source/mali-panvk-main
          chmod +x build.sh
          ./build.sh "$ANDROID_NDK_HOME"

      - name: Verificar biblioteca Vulkan
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/panvk-check"

          shopt -s nullglob
          archives=(source/mali-panvk-main/dist/*.zip)

          if [ ${#archives[@]} -eq 0 ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          for archive in "${archives[@]}"; do
            echo "Analisando pacote: $archive"
            folder="$RUNNER_TEMP/panvk-check/$(basename "$archive" .zip)"
            mkdir -p "$folder"
            unzip -q "$archive" -d "$folder"
          done

          mapfile -t libraries < <(
            find "$RUNNER_TEMP/panvk-check" \
              -type f -name "libvulkan_panfrost.so"
          )

          if [ ${#libraries[@]} -eq 0 ]; then
            echo "ERRO: biblioteca Vulkan não encontrada."
            exit 1
          fi

          for library in "${libraries[@]}"; do
            echo "===== IDENTIFICAÇÃO ELF ====="
            file "$library"
            readelf -h "$library"

            readelf -h "$library" | grep -q "ELF64"
            readelf -h "$library" | grep -q "AArch64"

            echo "ARQUITETURA CONFIRMADA: ELF64 AArch64"

            echo "===== DEPENDÊNCIAS ====="
            readelf -d "$library" | grep NEEDED || true

            echo "===== SHA-256 ====="
            sha256sum "$library"

            echo "===== TAMANHO ====="
            ls -lh "$library"
          done

      - name: Analisar metadados e licenças
        run: |
          set -e

          PACKAGE_DIR="$RUNNER_TEMP/panvk-check/mali-panvk-27.0.0-devel"

          echo "===== METADADOS ====="
          test -f "$PACKAGE_DIR/meta.json"
          cat "$PACKAGE_DIR/meta.json"

          python3 - "$PACKAGE_DIR/meta.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)

          required = ["name", "driverVersion", "minApi", "libraryName"]

          for key in required:
              if key not in data:
                  raise SystemExit(f"ERRO: campo ausente: {key}")
              print(f"{key}: {data[key]}")

          if data["libraryName"] != "libvulkan_panfrost.so":
              raise SystemExit("ERRO: biblioteca inesperada")

          print("METADADOS JSON: VÁLIDOS")
          PY

          echo "===== AVISOS E LICENÇAS ====="
          test -f "$PACKAGE_DIR/NOTICE.txt"
          head -n 100 "$PACKAGE_DIR/NOTICE.txt"

          echo "===== CONTEÚDO DO PACOTE ====="
          find "$PACKAGE_DIR" -maxdepth 2 -type f -printf '%P (%s bytes)\n'

          echo "ANÁLISE DO PACOTE CONCLUÍDA"

      - name: Analisar funções Vulkan exportadas
        run: |
          set -e

          LIBRARY="$RUNNER_TEMP/panvk-check/mali-panvk-27.0.0-devel/libvulkan_panfrost.so"

          test -f "$LIBRARY"

          echo "===== FUNÇÕES EXPORTADAS ====="

          nm -D --defined-only "$LIBRARY" \
            | tee "$RUNNER_TEMP/panvk-check/exported-symbols.txt"

          echo "===== INTERFACE ICD VULKAN ====="

          for symbol in \
            vk_icdGetInstanceProcAddr \
            vk_icdGetPhysicalDeviceProcAddr \
            vk_icdNegotiateLoaderICDInterfaceVersion
          do
            if grep -q "$symbol" \
              "$RUNNER_TEMP/panvk-check/exported-symbols.txt"; then
              echo "ENCONTRADO: $symbol"
            else
              echo "AUSENTE: $symbol"
            fi
          done

          grep -q 'vk_icdGetInstanceProcAddr' \
            "$RUNNER_TEMP/panvk-check/exported-symbols.txt"

          echo "INTERFACE ICD PRINCIPAL CONFIRMADA"

          echo "===== CONTAGEM DE SÍMBOLOS ====="
          wc -l "$RUNNER_TEMP/panvk-check/exported-symbols.txt"

      - name: Analisar referências Mali G720 e kbase
        run: |
          set -e

          SOURCE_DIR="source/mali-panvk-main"

          echo "===== REFERÊNCIAS NO CÓDIGO-FONTE ====="

          for term in \
            "G720" \
            "Valhall" \
            "Bifrost" \
            "kbase" \
            "CSF" \
            "0xc8700010"
          do
            echo "----- Procurando: $term -----"

            grep -R -n -i -E "$term" "$SOURCE_DIR" \
              --include='*.c' \
              --include='*.h' \
              --include='*.cpp' \
              --include='*.hpp' \
              --include='*.xml' \
              --include='*.json' \
              --include='*.py' \
              > "$RUNNER_TEMP/search-results.txt" || true

            if [ -s "$RUNNER_TEMP/search-results.txt" ]; then
              sed -n '1,20p' "$RUNNER_TEMP/search-results.txt"
              echo "Referências encontradas para: $term"
            else
              echo "Nenhuma referência textual encontrada para: $term"
            fi
          done

          echo "ANÁLISE DE REFERÊNCIAS CONCLUÍDA"

      - name: Auditoria específica Mali G720 MC7
        run: |
          set -e

          SOURCE="source/mali-panvk-main"

          echo "===== IDENTIFICAÇÃO G720 ====="
          grep -n -i -C 5 "G720" \
            "$SOURCE/src/panfrost/model/pan_model.c" || true

          echo "===== IDENTIFICAÇÃO DO GPU ID ====="

          grep -R -n -i -E \
            '0xc870|0xc8[0-9a-f]{2}|PAN_PROD_ID|gpu_id' \
            "$SOURCE/src/panfrost/model" \
            "$SOURCE/src/panfrost/lib" \
            --include='*.c' --include='*.h' \
            > "$RUNNER_TEMP/gpu-id-results.txt" || true

          sed -n '1,100p' "$RUNNER_TEMP/gpu-id-results.txt"

          echo "===== IMPLEMENTAÇÃO KBASE E CSF ====="

          find "$SOURCE/src/panfrost" \
            -type f \( -iname '*kbase*' -o -iname '*csf*' \) \
            ! -path '*/build-*/*' -print

          grep -R -n -i -E 'kbase|CSF' \
            "$SOURCE/src/panfrost/lib" \
            "$SOURCE/src/panfrost/vulkan" \
            --include='*.c' --include='*.h' \
            > "$RUNNER_TEMP/kbase-csf-results.txt" || true

          sed -n '1,100p' "$RUNNER_TEMP/kbase-csf-results.txt"

          echo "===== CONFIGURAÇÃO DE COMPILAÇÃO ====="

          sed -n '1,240p' "$SOURCE/build.sh"

          echo "===== ALVOS DE COMPILAÇÃO MESON ====="

          python3 - "$SOURCE/build-android/meson-info/intro-targets.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              targets = json.load(f)

          for target in targets:
              name = target.get("name", "")
              sources = target.get("target_sources", [])
              text = json.dumps(sources).lower()

              if any(term in (name + text).lower()
                     for term in ("panvk", "panfrost", "kbase", "csf")):
                  print("ALVO:", name)
                  print("FONTES:", text[:2500])
          PY

          echo "===== OPÇÕES MESON RELEVANTES ====="

          python3 - "$SOURCE/build-android/meson-info/intro-buildoptions.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              options = json.load(f)

          for option in options:
              name = option.get("name", "")
              if any(term in name.lower() for term in
                     ("android", "platform", "vulkan", "panvk",
                      "arch", "api", "prefix", "libdir")):
                  print(name, "=", option.get("value"))
          PY

          echo "AUDITORIA ESPECÍFICA CONCLUÍDA"

      - name: Preparar pacote AdrenoTools ADPKG
        run: |
          set -euo pipefail
          SOURCE_ZIP="source/mali-panvk-main/dist/mali-panvk-27.0.0-devel.zip"
          OUT_DIR="source/mali-panvk-main/dist-adpkg"
          OUT="$OUT_DIR/panvk_poco_x7_pro_mc7.adpkg.zip"
          test -s "$SOURCE_ZIP"
          mkdir -p "$OUT_DIR"
          cp "$SOURCE_ZIP" "$OUT"
          unzip -t "$OUT"
          unzip -Z1 "$OUT" | grep -qx 'meta.json'
          unzip -Z1 "$OUT" | grep -qx 'libvulkan_panfrost.so'
          unzip -p "$OUT" meta.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("libraryName") == "libvulkan_panfrost.so"; assert all(k in d for k in ("name","driverVersion","minApi","libraryName"))'
          echo "===== ADPKG SHA-256 ====="
          sha256sum "$OUT"
          echo "===== ADPKG CONTENTS ====="
          unzip -l "$OUT"

      - name: Disponibilizar ZIP compilado
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-POCO-X7-Pro-MC7
          path: source/mali-panvk-main/dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar pacote ADPKG
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-POCO-X7-Pro-MC7-ADPKG
          path: source/mali-panvk-main/dist-adpkg/panvk_poco_x7_pro_mc7.adpkg.zip
          if-no-files-found: error
          retention-days: 14

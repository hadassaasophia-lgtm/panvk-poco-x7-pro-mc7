
name: PanVK POCO X7 Pro MC7

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extrair código-fonte
        run: |
          mkdir -p source
          unzip -q mali-panvk-main.zip -d source
          echo "Código-fonte extraído."

      - name: Verificar arquivos essenciais
        run: |
          find source -name meson.build
          test -f source/mali-panvk-main/meson.build
          echo "Estrutura Mesa encontrada."

      - name: Verificar script de compilação
        run: |
          echo "Verificando build.sh..."
          test -f source/mali-panvk-main/build.sh
          ls -lh source/mali-panvk-main/build.sh
          echo "Script de compilação encontrado."
